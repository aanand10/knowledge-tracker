<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Recall: interview prep that sticks. Topic notes, progress tracking and spaced repetition so you remember it on interview day."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#0d1117" />
		<!-- Link previews (LinkedIn, Slack, WhatsApp, X). Crawlers need absolute URLs. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Recall" />
		<meta property="og:title" content="Recall: frontend interview prep that sticks" />
		<meta
			property="og:description"
			content="259 frontend interview topics with plain-language notes, spaced repetition, daily streaks and sync across devices. Free."
		/>
		<meta property="og:url" content="https://aanand10.github.io/knowledge-tracker/" />
		<meta property="og:image" content="https://aanand10.github.io/knowledge-tracker/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Recall: frontend interview prep that sticks" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:image"
			content="https://aanand10.github.io/knowledge-tracker/og-image.png"
		/>
		<title>Recall</title>
		<script>
			// Apply the theme before first paint to avoid a light/dark flash.
			// Mirrors src/lib/stores/theme.svelte.ts.
			(function () {
				var pref = 'system';
				try {
					pref = localStorage.getItem('knowledge-tracker:theme') || 'system';
				} catch (e) {}
				var dark =
					pref === 'dark' ||
					(pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
