<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Recall: interview prep that sticks. Topic notes, progress tracking and spaced repetition so you remember it on interview day."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>Recall</title>
		<script>
			// Apply the theme before first paint to avoid a light/dark flash.
			// Mirrors src/lib/stores/theme.svelte.ts.
			(function () {
				var pref = 'system';
				try {
					pref = localStorage.getItem('knowledge-tracker:theme') || 'system';
				} catch (e) {}
				var dark =
					pref === 'dark' ||
					(pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
