<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			* {
				margin: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				background: #0d1117;
				color: #e6edf3;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
				position: relative;
				overflow: hidden;
			}
			.grid {
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(#30363d55 1px, transparent 1px),
					linear-gradient(90deg, #30363d55 1px, transparent 1px);
				background-size: 40px 40px;
				mask-image: radial-gradient(ellipse at 80% 40%, #000 0%, transparent 70%);
			}
			.wrap {
				position: relative;
				padding: 72px 80px;
				height: 100%;
				display: flex;
				flex-direction: column;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 22px;
			}
			.logo {
				width: 96px;
				height: 96px;
			}
			.name {
				font-size: 76px;
				font-weight: 800;
				letter-spacing: -1.5px;
			}
			h1 {
				margin-top: 44px;
				font-size: 56px;
				line-height: 1.12;
				font-weight: 750;
				letter-spacing: -1px;
				max-width: 900px;
			}
			h1 em {
				font-style: normal;
				color: #d29922;
			}
			.chips {
				margin-top: 40px;
				display: flex;
				flex-wrap: wrap;
				gap: 14px;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 24px;
			}
			.chip {
				border: 1px solid #30363d;
				background: #161b22;
				padding: 10px 18px;
				border-radius: 8px;
				color: #c9d1d9;
			}
			.chip b {
				color: #3fb950;
				font-weight: 700;
			}
			.url {
				margin-top: auto;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 24px;
				color: #8d96a0;
			}
			.flame {
				position: absolute;
				right: 84px;
				top: 76px;
				font-family: ui-monospace, Menlo, monospace;
				font-size: 26px;
				color: #d29922;
				border: 2px solid #d29922;
				border-radius: 999px;
				padding: 8px 18px;
			}
		</style>
	</head>
	<body>
		<div class="grid"></div>
		<div class="wrap">
			<div class="brand">
				<div class="logo">
					<svg viewBox="0 0 32 32" width="100%" height="100%">
						<rect width="32" height="32" rx="8" fill="#e6edf3" />
						<g
							transform="translate(6 6) scale(0.8333)"
							fill="none"
							stroke="#0d1117"
							stroke-width="2.6"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
							<path d="M21 3v5h-5" />
						</g>
						<circle cx="16" cy="16" r="2.6" fill="#d29922" />
					</svg>
				</div>
				<div class="name">Recall</div>
			</div>
			<h1>Frontend interview prep that <em>sticks</em>.</h1>
			<div class="chips">
				<span class="chip"><b>259</b> topics</span><span class="chip">spaced repetition</span
				><span class="chip">JS · React · Svelte</span><span class="chip">system design</span
				><span class="chip">sync across devices</span>
			</div>
			<div class="url">aanand10.github.io/knowledge-tracker · free</div>
		</div>
		<div class="flame">🔥 daily streak</div>
	</body>
</html>
